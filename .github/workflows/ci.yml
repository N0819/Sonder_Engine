name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Named `fast` for history (it is a required check elsewhere), but it has not
  # been the reduced tier since test databases moved to tmpfs: `make check-fast`
  # now compiles, runs the structure/map checks, and runs EVERY test, on both
  # interpreters, in about 40 seconds. The separate `full` job that used to sit
  # after this one was a strict subset of it and was deleted.
  fast:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A gate that never reports is as uninformative as one that is skipped,
    # which is the defect the `always()` guards below were added to fix. A
    # hang is the other way to not report: measured 2026-08-19, the browser
    # job sat in `playwright install --with-deps` for fifty minutes with no
    # ceiling, so the run for a tagged release could not conclude at all.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Run fast checks
        run: make check-fast

  pydantic1:
    # `constraints.txt` pins Pydantic 2, so every other job exercises only one
    # side of the declared `pydantic>=1.10.13,<3` range. `schemas.py` carries a
    # branch per major (`_declared`), and the 1.x branch had no coverage here at
    # all -- which is how a 1.x-only internal reached import scope and stopped
    # the engine starting for anyone who resolved to 2.x. See docs/guides/TESTING.md.
    #
    # The failure runs the other way too, and this job could not see it. It ran
    # `make test-fast`, which deselects every database-backed test -- so a
    # 2.x-only defect was invisible to CI unless it happened to sit in the
    # non-database half. `_subject_field` was read with a bare `getattr`, which
    # returns a plain string on 1.x and an unhashable `ModelPrivateAttr` on 2.x;
    # the 1.x job stayed green, and the feature never worked in a default
    # install. Both directions now run the WHOLE suite, which is affordable
    # since it costs ~40s.
    name: Schemas on Pydantic 1.x
    timeout-minutes: 20
    # `needs: fast` is ORDERING, not a precondition. Without an
    # always() guard GitHub SKIPS this job when either `fast` matrix
    # leg fails, so a 3.11 parse error erased the evidence from two
    # unrelated gates and the run reported neither. Reported by the
    # Directive team, who read a run where exactly that happened.
    needs: fast
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install test dependencies, then downgrade past the constraint
        run: |
          python -m pip install -c constraints.txt -r requirements-dev.txt
          python -m pip install "pydantic>=1.10.13,<2"
      - name: Confirm the major under test
        run: |
          python - <<'EOF'
          import pydantic
          assert pydantic.VERSION.startswith("1."), (
              f"this job must run Pydantic 1.x, got {pydantic.VERSION}")
          print("pydantic", pydantic.VERSION)
          EOF
      # Everything, not just the schema tests: the exposure is not limited to
      # `schemas.py`. Any module reaching for a 2.x-only API (`model_validate`,
      # `model_dump`) breaks 1.x the same way.
      - name: Run the full suite on Pydantic 1.x
        run: make test-full

  browser:
    name: Browser behavior
    timeout-minutes: 25
    # `needs: fast` is ORDERING, not a precondition. Without an
    # always() guard GitHub SKIPS this job when either `fast` matrix
    # leg fails, so a 3.11 parse error erased the evidence from two
    # unrelated gates and the run reported neither. Reported by the
    # Directive team, who read a run where exactly that happened.
    needs: fast
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install browser-test dependencies
        run: python -m pip install -c constraints.txt -r requirements-browser.txt
      # The browser payload, keyed on the pinned Playwright version. A cache
      # hit removes the download entirely; it does nothing for apt, which is
      # why apt is gone below.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('constraints.txt') }}
      - name: Install Chromium
        # NO `--with-deps`. That flag shells out to apt-get to install system
        # libraries, and apt is the part that is not deterministic here: it
        # hung for fifty minutes on 2026-08-19 with no ceiling, and once a
        # ceiling existed it spent twelve minutes downloading Ubuntu font
        # packages and hit that instead -- so the tagged release commit has
        # passing Python jobs and no browser evidence at all.
        #
        # The libraries are already on the runner image, which the green runs
        # either side of that failure prove. `--with-deps` exists for bare
        # containers, and paying apt on every run to reinstall what is already
        # present bought nothing but a flaky mirror. If a future image ever
        # does drop a library, Chromium fails to launch and says which one,
        # which is a better failure than a twelve-minute download of fonts.
        timeout-minutes: 6
        run: python -m playwright install chromium
      - name: Run browser behavior tests
        run: make test-browser
