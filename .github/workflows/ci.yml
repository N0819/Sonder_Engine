name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Run fast checks
        run: make check-fast

  full:
    name: Full Python suite
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Run full suite
        run: make test-full

  pydantic1:
    # `constraints.txt` pins Pydantic 2, so every other job exercises only one
    # side of the declared `pydantic>=1.10.13,<3` range. `schemas.py` carries a
    # branch per major (`_declared`), and the 1.x branch had no coverage here at
    # all -- which is how a 1.x-only internal reached import scope and stopped
    # the engine starting for anyone who resolved to 2.x. See docs/TESTING.md.
    name: Schemas on Pydantic 1.x
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install test dependencies, then downgrade past the constraint
        run: |
          python -m pip install -c constraints.txt -r requirements-dev.txt
          python -m pip install "pydantic>=1.10.13,<2"
      - name: Confirm the major under test
        run: |
          python - <<'EOF'
          import pydantic
          assert pydantic.VERSION.startswith("1."), (
              f"this job must run Pydantic 1.x, got {pydantic.VERSION}")
          print("pydantic", pydantic.VERSION)
          EOF
      # The fast tier, not just the schema tests: the exposure is not limited to
      # `schemas.py`. Any module reaching for a 2.x-only API (`model_validate`,
      # `model_dump`) breaks 1.x the same way, and the whole tier costs ~10s.
      - name: Run the fast tier on Pydantic 1.x
        run: make test-fast

  browser:
    name: Browser behavior
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install browser-test dependencies
        run: python -m pip install -c constraints.txt -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser behavior tests
        run: make test-browser
