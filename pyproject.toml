[project]
name = "fiction-engine"
version = "0.1.0"
description = "Local multi-agent interactive-fiction engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.101,<1",
  "httpx>=0.24,<1",
  "numpy>=1.26,<3",
  "pydantic>=1.10.13,<3",
  "requests>=2.31,<3",
  "sqlite-vec>=0.1.6,<0.2",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
browser = [
  "playwright>=1.50,<2",
  "pytest-playwright>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "slow: high-cost integration and concurrency tests omitted by make test-fast",
]
