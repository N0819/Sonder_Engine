[project]
name = "sonder-engine"
# The release name is "alpha 9.6.1" and the git tag is `alpha9.6.1`; "alpha"
# is this project's phase label, not a PEP 440 pre-release segment, so it
# cannot ride in this field. Nothing installs this package — the field was
# left at a placeholder 0.1.0 through nine releases, which is worse than a
# version that is merely a different spelling of the tag.
version = "9.6.2"
description = "Sonder Engine — a local multi-agent interactive-fiction engine"
# Upper bound is real, not caution: the pinned pydantic-core has no wheel
# above 3.13, so pip falls back to compiling it and fails inside a Rust
# toolchain. Both launchers already enforce this range; saying it here too
# means a plain `pip install -e .` fails with the reason instead of a build log.
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.101,<1",
  "httpx>=0.24,<1",
  "numpy>=1.26,<3",
  "pydantic>=1.10.13,<3",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
browser = [
  "playwright>=1.50,<2",
  "pytest-playwright>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers: an unregistered marker is an error, not a silent no-op.
# Without it `-m "not sloow"` selects everything and reports success.
addopts = "-ra --strict-markers"
markers = [
  "slow: database-backed tests (they request the temp_db fixture); deselected only by make test-fast, which is a CI matrix-breadth job",
]
