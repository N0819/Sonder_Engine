[project]
name = "fiction-engine"
version = "0.1.0"
description = "Local multi-agent interactive-fiction engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.101,<1",
  "httpx>=0.24,<1",
  "numpy>=1.26,<3",
  "pydantic>=1.10.13,<3",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
browser = [
  "playwright>=1.50,<2",
  "pytest-playwright>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers: an unregistered marker is an error, not a silent no-op.
# Without it `-m "not sloow"` selects everything and reports success.
addopts = "-ra --strict-markers"
markers = [
  "slow: database-backed tests (they request the temp_db fixture); deselected only by make test-fast, which is a CI matrix-breadth job",
]
