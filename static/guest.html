<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<title>Sonder Engine — Join a Story</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/static/js/i18n.js" defer></script>
<script src="/static/js/ui/appearance-preflight.js?release=alpha98-ui12-7eaf6b3481a3"></script>
<link rel="stylesheet" href="/static/css/ui/reset.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/tokens.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/carbon-signal.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/ash-brass.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/midnight-ink.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/parchment-night.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/neon-circuit.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/modern-slate.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/themes/custom.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/typography.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/components.css?release=alpha98-ui12-7eaf6b3481a3">
<link rel="stylesheet" href="/static/css/ui/guest.css?release=alpha98-ui12-7eaf6b3481a3">
</head>
<body class="ui-guest-page">
<header class="ui-guest-header">
  <span class="ui-guest-header__mark" aria-hidden="true">S</span>
  <span class="ui-guest-header__copy">
    <strong>Sonder Engine</strong>
    <span id="head-sub">Guest story</span>
  </span>
</header>

<main id="join-screen" class="ui-guest-join">
  <section id="join-card" class="ui-card ui-guest-join__card" aria-labelledby="join-title">
    <p class="ui-guest-eyebrow">Join a story</p>
    <h1 id="join-title">Enter your join code</h1>
    <p class="ui-guest-join__intro">Use the code your host shared with you. You can start playing as soon as the story opens.</p>
    <label class="ui-field" for="code-input">
      <span class="ui-field__label">Join code</span>
      <input id="code-input" class="ui-field__control" placeholder="ABCD1234" autocomplete="off" autocapitalize="characters" maxlength="8" inputmode="text">
    </label>
    <button id="join-btn" class="ui-button ui-button--primary ui-button--prominent">Join story</button>
    <div class="ui-field__error ui-guest-status" id="join-err" role="status" aria-live="polite"></div>
  </section>
</main>

<main id="play-screen" class="ui-guest-play" hidden>
  <div id="connection-status" class="ui-notice ui-guest-connection" data-tone="warning" role="status" aria-live="polite" hidden>
    <span id="connection-message"></span>
    <button id="connection-retry" class="ui-button ui-button--compact">Reconnect</button>
  </div>
  <div id="msgs" class="ui-guest-transcript" aria-live="polite" aria-label="Story transcript"></div>
  <div class="ui-guest-composer">
    <div class="ui-guest-composer__inner">
      <label class="ui-guest-composer__field">
        <span class="ui-visually-hidden">Your action or speech</span>
        <textarea id="input" class="ui-field__control" aria-label="Your action or speech" placeholder="Act, speak, or leave empty…"></textarea>
      </label>
      <button id="send-btn" class="ui-button ui-button--primary">Send</button>
      <div id="send-status" class="ui-guest-send-status" role="status" aria-live="polite"></div>
    </div>
  </div>
</main>

<script>
"use strict";
const codeInput = document.getElementById("code-input");
const joinBtn = document.getElementById("join-btn");
const joinErr = document.getElementById("join-err");
const joinScreen = document.getElementById("join-screen");
const playScreen = document.getElementById("play-screen");
const headSub = document.getElementById("head-sub");
const msgsEl = document.getElementById("msgs");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const sendStatus = document.getElementById("send-status");
const connectionStatus = document.getElementById("connection-status");
const connectionMessage = document.getElementById("connection-message");
const connectionRetry = document.getElementById("connection-retry");

const params = new URLSearchParams(location.search);
if (params.get("code")) codeInput.value = params.get("code").toUpperCase();

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text) } catch (e) { data = { detail: text } }
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

let joining = false;
async function doJoin() {
  const code = codeInput.value.trim().toUpperCase();
  if (!code || joining) return;
  joining = true;
  joinBtn.disabled = true;
  joinBtn.dataset.loading = "true";
  joinBtn.setAttribute("aria-busy", "true");
  joinErr.textContent = "";
  try {
    await api("POST", "/api/join", { code });
    const state = await api("GET", "/api/guest/state");
    showPlayState(state);
    startPolling();
    inputEl.focus();
  } catch (e) {
    joinErr.textContent = e.message;
    codeInput.focus();
  } finally {
    joining = false;
    joinBtn.disabled = false;
    joinBtn.dataset.loading = "false";
    joinBtn.removeAttribute("aria-busy");
  }
}
joinBtn.onclick = doJoin;
codeInput.addEventListener("keydown", e => { if (e.key === "Enter") doJoin() });

let nextIdx = 0;
let busy = false;

function render(turns) {
  msgsEl.innerHTML = "";
  for (const t of turns) {
    const d = document.createElement("article");
    d.className = t.stale ? "ui-guest-turn turn stale" : "ui-guest-turn turn";
    if (t.player_input) {
      const pin = document.createElement("div");
      pin.className = "ui-guest-turn__input pin";
      pin.textContent = t.player_input;
      d.appendChild(pin);
    }
    const prose = document.createElement("div");
    if (t.prose) {
      prose.className = "ui-guest-turn__prose prose";
      prose.textContent = t.prose;
    } else {
      prose.className = "ui-guest-turn__waiting waiting";
      prose.textContent = "Waiting for this beat to resolve…";
    }
    d.appendChild(prose);
    if (t.stale_from) {
      const note = document.createElement("div");
      note.className = "ui-guest-turn__stale stale-note";
      note.textContent = t.prose_stale
        ? `Superseded — this text was written before “${t.stale_from.label}” was re-run.`
        : `Partly out of date — steps from “${t.stale_from.label}” onward were not recomputed.`;
      d.appendChild(note);
    }
    msgsEl.appendChild(d);
  }
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function setConnected() {
  connectionStatus.hidden = true;
  connectionMessage.textContent = "";
}

function showPlayState(state) {
  headSub.textContent = `${state.chat_name} — playing as ${state.persona_name}`;
  joinScreen.hidden = true;
  playScreen.hidden = false;
  nextIdx = state.next_idx;
  render(state.turns);
  setConnected();
}

let refreshInFlight = null;
function refresh() {
  if (refreshInFlight) return refreshInFlight;
  refreshInFlight = (async () => {
    try {
      const state = await api("GET", "/api/guest/state");
      showPlayState(state);
      return true;
    } catch (e) {
      connectionMessage.textContent = "Connection lost — " + e.message;
      connectionStatus.hidden = false;
      stopPolling();
      return false;
    }
  })().finally(() => {
    refreshInFlight = null;
  });
  return refreshInFlight;
}

let pollHandle = null;
let polling = false;

function stopPolling() {
  polling = false;
  if (pollHandle !== null) clearTimeout(pollHandle);
  pollHandle = null;
}

async function pollOnce() {
  if (!polling) return;
  if (!document.hidden) await refresh();
  if (polling) pollHandle = setTimeout(pollOnce, 10000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && polling) refresh();
});

function startPolling() {
  stopPolling();
  polling = true;
  pollHandle = setTimeout(pollOnce, 10000);
}

async function resumeGuestSession() {
  try {
    const state = await api("GET", "/api/guest/state");
    showPlayState(state);
    startPolling();
  } catch (e) {
    codeInput.focus();
  }
}

async function reconnect() {
  connectionRetry.disabled = true;
  connectionRetry.dataset.loading = "true";
  const restored = await refresh();
  connectionRetry.disabled = false;
  connectionRetry.dataset.loading = "false";
  if (restored) {
    startPolling();
    inputEl.focus();
  }
}
connectionRetry.onclick = reconnect;

async function send() {
  const text = inputEl.value.trim();
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  sendBtn.dataset.loading = "true";
  sendStatus.textContent = "";
  try {
    await api("POST", "/api/guest/input", { idx: nextIdx, input: text });
    inputEl.value = "";
    await refresh();
  } catch (e) {
    sendStatus.textContent = e.message;
    inputEl.focus();
  } finally {
    busy = false;
    sendBtn.disabled = false;
    sendBtn.dataset.loading = "false";
  }
}
sendBtn.onclick = send;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send() }
});

resumeGuestSession();
</script>
</body>
</html>
