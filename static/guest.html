<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonder Engine — Join a Story</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The localization rules, shared with the SPA (utils.js reads the same
     file); i18n.js is only this page's catalog fetch. Deferred, so the
     core is evaluated first. -->
<script src="/static/js/i18n-core.js" defer></script>
<script src="/static/js/i18n.js" defer></script>
<script src="/static/js/theme-init.js"></script>
<!-- Shares the host app's actual stylesheet (tokens, .turn/.pin/.prose,
     button variants) rather than a hand-rolled parallel palette -- a
     guest's first-ever impression of the app used to share nothing
     visually with what the host sees: different accent, different
     radii, different focus ring, filled-blue buttons where the host UI
     defaults to a gray gradient. Only guest-page-specific layout
     (the join screen, the composer bar) is defined locally below. -->
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/themes.css">
<style>
  body { display: flex; flex-direction: column; }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--bd);
    display: flex; align-items: center; gap: 10px; min-height: 50px;
    background: var(--chrome-bg);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .sub { color: var(--dim); font-size: 13px; }
  #join-screen, #play-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #join-screen { align-items: center; justify-content: center; padding: 24px; gap: 14px; }
  #join-screen .card { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
  #code-input { text-transform: uppercase; letter-spacing: .05em; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; }
  #msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .turn .waiting { color: var(--dim); font-style: italic; }
  .turn .stale-note { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .turn.queued { opacity: .8; }
  #composer {
    display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--bd);
  }
  #composer textarea { flex: 1; resize: none; height: 52px; max-height: 160px; }
</style>
</head>
<body>
<header>
  <h1>Sonder Engine</h1>
  <span class="sub" id="head-sub">Join a friend's story</span>
</header>

<div id="join-screen">
  <div class="card">
    <div>Enter the join code your friend gave you.</div>
    <label for="code-input">Join code</label>
    <input id="code-input" placeholder="ABCD1234" autocomplete="off" autocapitalize="characters" maxlength="8">
    <button id="join-btn" class="primary">Join story</button>
    <div class="err" id="join-err" role="alert" aria-live="polite"></div>
  </div>
</div>

<div id="play-screen" style="display:none">
  <div id="msgs"></div>
  <div id="composer">
    <textarea id="input" aria-label="Your action or speech" placeholder="Act, speak, or leave empty…"></textarea>
    <button id="send-btn" class="primary">Send</button>
  </div>
</div>

<script>
"use strict";
const codeInput = document.getElementById("code-input");
const joinBtn = document.getElementById("join-btn");
const joinErr = document.getElementById("join-err");
const joinScreen = document.getElementById("join-screen");
const playScreen = document.getElementById("play-screen");
const headSub = document.getElementById("head-sub");
const msgsEl = document.getElementById("msgs");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");

const params = new URLSearchParams(location.search);
if (params.get("code")) codeInput.value = params.get("code").toUpperCase();

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text) } catch (e) { data = { detail: text } }
  if (!res.ok) {
    const error = new Error(data.detail || `HTTP ${res.status}`);
    // The poll stops for a session the server no longer honours and for
    // nothing else (`refresh` below), so the status has to survive the throw.
    error.status = res.status;
    throw error;
  }
  return data;
}

async function doJoin() {
  const code = codeInput.value.trim().toUpperCase();
  if (!code) return;
  joinBtn.disabled = true;
  joinErr.textContent = "";
  try {
    await api("POST", "/api/join", { code });
    const state = await api("GET", "/api/guest/state");
    showPlayState(state);
    startPolling();
  } catch (e) {
    joinErr.textContent = e.message;
  } finally {
    joinBtn.disabled = false;
  }
}
joinBtn.onclick = doJoin;
codeInput.addEventListener("keydown", e => { if (e.key === "Enter") doJoin() });

let nextIdx = 0;
let busy = false;
// The line this page sent that no beat has taken yet. `guest_input` files it
// under an index no turn row has, and `guest_state` lists only turn rows, so
// the line vanished the moment it was sent -- and a guest who thought it had
// failed and sent again silently REPLACED it, because the server upserts on
// (chat, idx, persona) (frontend audit 2026-11-01, F9). Shown as queued until
// the state shows a beat carrying it; a server that sends its own record of
// unserved lines (`pending_input`) is believed instead, which also survives a
// reload.
let queuedLine = null;

function storyText(className, text) {
  // Story text, not interface text: a model or the guest wrote it, and the
  // catalog only looks like it by accident -- a guest who typed "Continue"
  // read 続ける as their own line (F8). i18n.js honours translate="no".
  const node = document.createElement("div");
  node.className = className;
  node.setAttribute("translate", "no");
  node.textContent = text;
  return node;
}

function queuedLines(state) {
  if (Array.isArray(state.pending_input)) {
    queuedLine = null;
    return state.pending_input;
  }
  if (queuedLine && (state.turns || []).some(
      t => t.idx >= queuedLine.idx && t.player_input === queuedLine.input)) {
    queuedLine = null;
  }
  return queuedLine ? [queuedLine] : [];
}

function render(state) {
  const turns = state.turns || [];
  const newest = turns.length ? turns[turns.length - 1] : null;
  msgsEl.innerHTML = "";
  for (const t of turns) {
    // WHICH BEATS CAN STILL ARRIVE. Every turn of the story is listed, and a
    // guest has a render only for the beats of their own era since they
    // joined -- so fifty beats before a friend joined used to read "Waiting
    // for this beat to resolve…" forever, and the one beat that really was
    // pending looked like all the rest (F7). A turn below the newest has been
    // followed by another and will not gain a render now; only the newest can
    // still be on its way. A server that says so per turn (`pending`) is
    // believed instead of that rule.
    const pending = typeof t.pending === "boolean" ? t.pending : t === newest;
    if (!t.prose && !t.player_input && !pending) continue;
    const d = document.createElement("div");
    // .turn.stale dims the prose via the shared stylesheet; the note below
    // says why, because a dim on its own is not a message.
    d.className = t.stale ? "turn stale" : "turn";
    if (t.player_input) d.appendChild(storyText("pin", t.player_input));
    if (t.prose) {
      d.appendChild(storyText("prose", t.prose));
    } else if (pending) {
      const waiting = document.createElement("div");
      waiting.className = "waiting";
      waiting.textContent = "Waiting for this beat to resolve…";
      d.appendChild(waiting);
    }
    if (t.stale_from) {
      // NO STAGE IS NAMED. The step's label is the host's: a character's
      // stage is "Character · <true name>", so a guest whose persona knew a
      // woman only as "the hooded woman" read her name here (F1). What the
      // guest can act on is what happened to the text they are reading.
      const note = document.createElement("div");
      note.className = "stale-note";
      note.textContent = t.prose_stale
        ? "Superseded — this text was written before part of its beat was re-run."
        : "Partly out of date — part of this beat was re-run and the rest was not recomputed.";
      d.appendChild(note);
    }
    msgsEl.appendChild(d);
  }
  for (const line of queuedLines(state)) {
    const d = document.createElement("div");
    d.className = "turn queued";
    if (line.input) d.appendChild(storyText("pin", line.input));
    const note = document.createElement("div");
    note.className = "stale-note";
    note.textContent = "Queued for the next beat. Sending again replaces it.";
    d.appendChild(note);
    msgsEl.appendChild(d);
  }
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showPlayState(state) {
  // The two names are the story's, the words between them are the page's.
  const named = text => {
    const span = document.createElement("span");
    span.setAttribute("translate", "no");
    span.textContent = text;
    return span;
  };
  headSub.replaceChildren(named(state.chat_name), " — playing as ",
                          named(state.persona_name));
  joinScreen.style.display = "none";
  playScreen.style.display = "flex";
  nextIdx = state.next_idx;
  render(state);
}

let refreshInFlight = null;
let pollHandle = null;
let polling = false;
// How long the next poll waits: ten seconds while the server answers,
// doubling up to this ceiling while it does not. A rate, so named; ten
// seconds is the interval this page has always used.
const GUEST_POLL_MAX_MS = 60000;
let pollFailures = 0;

function refresh() {
  // A slow request must not overlap the next poll and later roll the
  // transcript back to an older next_idx.
  if (refreshInFlight) return refreshInFlight;
  refreshInFlight = (async () => {
    try {
      const state = await api("GET", "/api/guest/state");
      pollFailures = 0;
      showPlayState(state);
      // A view that stopped is live again the moment the server answers.
      if (!polling) startPolling();
      return true;
    } catch (e) {
      if (e.status === 401 || e.status === 403) {
        // A revoked or expired session is the one ending a poll cannot fix:
        // leave the last known view up rather than clearing it, and stop.
        headSub.textContent = "Your session has ended — ask the host for a new join code.";
        stopPolling();
      } else {
        // Anything else -- a server restarting after a commit, one 502 from
        // a proxy -- used to stop the live view for good (frontend audit
        // 2026-11-01, F10). Keep the view and keep asking, less often.
        pollFailures += 1;
        headSub.textContent = "Connection lost — retrying. " + e.message;
      }
      return false;
    }
  })().finally(() => {
    refreshInFlight = null;
  });
  return refreshInFlight;
}

function stopPolling() {
  polling = false;
  if (pollHandle !== null) clearTimeout(pollHandle);
  pollHandle = null;
}

function pollDelay() {
  return pollFailures ? Math.min(GUEST_POLL_MAX_MS, 10000 * 2 ** pollFailures) : 10000;
}

async function pollOnce() {
  if (!polling) return;
  // Skip the request while the tab is hidden -- a guest page left open in a
  // background tab was the one unconditional poll in the app, waking the
  // machine every ten seconds forever to fetch state nobody is looking at.
  // The visibilitychange handler below refreshes immediately on return, so
  // coming back to the tab still shows current state rather than up-to-ten-
  // seconds-stale.
  if (!document.hidden) await refresh();
  if (polling) pollHandle = setTimeout(pollOnce, pollDelay());
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && polling) refresh();
});

function startPolling() {
  // Callers already hold fresh state (from join or session restore), so wait
  // one interval instead of issuing a duplicate request immediately.
  stopPolling();
  polling = true;
  pollHandle = setTimeout(pollOnce, 10000);
}

async function resumeGuestSession() {
  try {
    const state = await api("GET", "/api/guest/state");
    showPlayState(state);
    startPolling();
  } catch (e) {
    // No valid HttpOnly guest cookie: remain on the join screen. The same
    // response intentionally covers missing, expired, and revoked sessions.
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  try {
    await api("POST", "/api/guest/input", { idx: nextIdx, input: text });
    queuedLine = { idx: nextIdx, input: text };
    inputEl.value = "";
    await refresh();
  } catch (e) {
    alert(e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
  }
}
sendBtn.onclick = send;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send() }
});

resumeGuestSession();
</script>
</body>
</html>
