<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonder Engine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/static/js/theme-init.js"></script>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/lorebooks.css">
<link rel="stylesheet" href="/static/themes.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="tabs">
      <button data-tab="chats" class="on">Stories</button>
      <button data-tab="chars">Characters</button>
      <button data-tab="personas">Personas</button>
      <button data-tab="lore">Lore</button>
    </div>
    <div id="sidelist"></div>
    <div id="sideactions"></div>
  </aside>

  <main id="main">
    <header id="top">
      <button id="b-menu" class="icon-button" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
      <div id="top-context">
        <span id="chatname" title="Current story">No story selected</span>
        <span id="framebar"></span>
      </div>
      <label
        class="tgl"
        title="Shows a detailed technical log of every internal stage as a turn runs, including raw model output. Off by default for a cleaner view — the story plays out exactly the same either way."
      >
        <input type="checkbox" id="streamtgl">
        <span>technical detail</span>
      </label>
      <div id="topactions" aria-label="Story tools">
        <button id="b-world" class="icon-button" title="World state" aria-label="World state">🌍</button>
        <button id="b-cast" class="icon-button" title="Cast, persona and lorebooks" aria-label="Cast, persona and lorebooks">👥</button>
        <button id="b-attire" class="icon-button" title="Attire" aria-label="Attire">👕</button>
        <button id="b-dlg" class="icon-button" title="Dialogue configuration" aria-label="Dialogue configuration">💬</button>
        <button id="b-style" class="icon-button" title="Genre and style" aria-label="Genre and style">🎭</button>
        <button id="b-backdrop" class="icon-button" title="Scene backdrops" aria-label="Scene backdrops">🖼</button>
        <button id="b-theme" class="icon-button" title="Appearance and themes" aria-label="Appearance and themes">🎨</button>
        <button id="b-api" title="API connections" aria-label="API connections">⚙ API</button>
        <button id="b-update" title="Check for updates from GitHub" aria-label="Check for updates">⬆ Update</button>
        <button id="b-prompts" class="icon-button" title="Prompts" aria-label="Prompts">📝</button>
        <button
          id="b-nsfw"
          class="nsfw-btn"
          title="Toggle uncensored adult content"
          aria-label="Toggle uncensored adult content"
        >NSFW: OFF</button>
      </div>
    </header>

    <!-- Other characters' condition, opt-in: the same panel, stacked directly
         above yours. -->
    <div id="vitals-npcs" class="hidden"></div>

    <div id="msgs">
      <div class="dim" style="margin:auto">
        Select or create a story to begin.
      </div>
    </div>

    <div id="turnstatus" class="hidden">
      <span class="spinner"></span>
      <span id="turnstatus-phase">Working…</span>
      <span id="turnstatus-elapsed" class="dim"></span>
    </div>

    <div id="live" class="hidden"></div>

    <div id="composer">

      <!-- The inner wrapper carries the measure so the field lines up with
           the prose column above it; #composer stays full-bleed so its top
           border and background still span the window. -->
      <div id="composer-inner">
        <textarea
          id="input"
          aria-label="Story input"
          placeholder="Act, speak, or leave empty to establish the scene… (Ctrl+Enter to send)"
        ></textarea>
        <button id="send" class="primary">Send ➤</button>
        <button id="stop" class="danger hidden">■ Stop</button>
      </div>

      <!-- Room ambience (ambience.js). Beside the input rather than in the top
           toolbar because these are mid-scene reflexes -- mute a bed that has
           started to grate, reroll one that landed wrong -- not settings
           configured once. Mute is deliberately its own button and not buried
           in the panel: it is the control someone needs in a hurry.
           A SIBLING of #composer-inner, not a child: that inner wrapper
           carries the 720px measure the prose column is aligned to, so
           anything inside it takes width away from the input. Out here it
           floats in the margin the full-bleed composer already has. -->
      <div id="ambience-bar" role="group" aria-label="Room ambience">
        <button id="b-amb-mute" class="icon-button" title="Mute ambience" aria-label="Mute ambience">🔊</button>
        <input id="amb-vol" type="range" min="0" max="1" step="0.01" value="0.35"
               title="Ambience volume" aria-label="Ambience volume">
        <button id="b-amb-reroll" class="icon-button" title="Different sound for this room" aria-label="Different sound for this room">🎲</button>
        <button id="b-ambience" class="icon-button" title="Room ambience" aria-label="Room ambience">🎧</button>
      </div>
    </div>

    <!-- Your own condition: the gutter between the sidebar and the story,
         resting just above the composer. A SIBLING of #composer, never a
         child -- as a child it was painted under #composer-inner, and z-index
         could not reliably win against the stacking contexts inside it. -->
    <div id="vitals" class="hidden"></div>
  </main>

  <aside id="drawer" class="hidden"></aside>
</div>

<div id="modal" class="hidden">
  <div id="modalbox">
    <div id="modalhead">
      <span id="modaltitle"></span>
      <button id="modalx" class="icon-button ghost" title="Close" aria-label="Close dialog">✕</button>
    </div>
    <div id="modalbody"></div>
  </div>
</div>

<div id="activity" class="hidden">
  <div id="activity-head">
    <span class="spinner"></span>
    <span id="activity-title">Background work</span>
    <span class="spacer"></span>
    <span id="activity-count" class="badge">0</span>
  </div>
  <div id="activity-list"></div>
</div>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/js/utils.js"></script>
<script src="/static/js/components.js"></script>
<script src="/static/js/editors.js"></script>
<script src="/static/js/lorebooks.js"></script>
<script src="/static/js/backdrops.js"></script>
<script src="/static/js/ambience.js"></script>
<!-- Weather draws itself: one generated tile moved by a CSS transform, no
     particle engine and so no vendored bundle to load. See the header of
     weather-fx.js for why that is a fraction of the power. -->
<script src="/static/js/weather-fx.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/themes.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
