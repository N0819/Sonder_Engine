<!doctype html>
<html lang="en" data-ui-next-entry="application" data-ui-next-version="wp03.1" data-layout-state="wide">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sonder Engine</title>
  <script src="/static/js/ui/appearance-preflight.js?release=wp03.1"></script>
  <link rel="stylesheet" href="/static/css/ui/reset.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/tokens.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/themes/carbon-signal.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/themes/ash-brass.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/themes/midnight-ink.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/themes/parchment-night.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/typography.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/components.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/utilities.css?release=wp03.1">
  <link rel="stylesheet" href="/static/css/ui/shell.css?release=wp03.1">
</head>
<body class="ui-app ui-shell-body">
  <a class="ui-shell__skip" href="#ui-shell-main">Skip to content</a>
  <div class="ui-shell" data-ui-shell>
    <nav class="ui-shell__navigation" aria-label="Primary" data-ui-region="primary-navigation">
      <a class="ui-shell__brand" href="#/play" aria-label="Sonder Engine · Play">
        <span class="ui-shell__brand-mark" aria-hidden="true">S</span>
        <span class="ui-shell__brand-copy">
          <span class="ui-shell__brand-name">Sonder</span>
          <span class="ui-shell__brand-kind">Engine</span>
        </span>
      </a>
      <ol class="ui-shell__destinations">
        <li>
          <a class="ui-shell__destination" href="#/play" data-core-destination="play" data-focus-identity="nav:play" aria-current="page">
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-play"></use></svg>
            <span class="ui-shell__destination-index" aria-hidden="true">01</span>
            <span class="ui-shell__destination-label">Play</span>
          </a>
        </li>
        <li>
          <a class="ui-shell__destination" href="#/library" data-core-destination="library" data-focus-identity="nav:library">
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-library"></use></svg>
            <span class="ui-shell__destination-index" aria-hidden="true">02</span>
            <span class="ui-shell__destination-label">Library</span>
          </a>
        </li>
        <li>
          <a class="ui-shell__destination" href="#/settings" data-core-destination="settings" data-focus-identity="nav:settings">
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-settings"></use></svg>
            <span class="ui-shell__destination-index" aria-hidden="true">03</span>
            <span class="ui-shell__destination-label">Settings</span>
          </a>
        </li>
      </ol>
      <button class="ui-shell__go-to ui-button ui-button--quiet" type="button" data-shell-go-to>
        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-search"></use></svg>
        <span>Go To</span>
        <kbd>Ctrl K</kbd>
      </button>
    </nav>

    <div class="ui-shell__center">
      <header class="ui-shell__header" data-ui-region="destination-header">
        <div class="ui-shell__orientation">
          <p class="ui-shell__eyebrow" data-shell-parent>Sonder Engine</p>
          <h1 class="ui-heading ui-heading--1" id="ui-shell-title" tabindex="-1" data-shell-heading>Play</h1>
          <p class="ui-shell__context" data-shell-context>Your active story and its tools stay together here.</p>
        </div>
        <div class="ui-shell__header-actions">
          <span class="ui-shell__save" data-shell-save-state>Nothing to save</span>
          <button class="ui-button ui-button--quiet ui-button--icon" type="button" aria-label="Open story tools" title="Story tools" data-shell-inspector-open>
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-tools"></use></svg>
          </button>
          <button class="ui-button ui-button--quiet ui-button--icon" type="button" aria-label="More actions" title="More actions" data-shell-more>
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-more"></use></svg>
          </button>
        </div>
      </header>

      <main class="ui-shell__workspace" id="ui-shell-main" aria-labelledby="ui-shell-title" data-ui-region="workspace" data-shell-scroll-region="workspace">
        <section class="ui-shell__destination-view" data-shell-destination-view aria-live="off">
          <div class="ui-empty" data-state="loading">
            <span class="ui-skeleton ui-shell__loading-line" aria-hidden="true"></span>
            <span>Loading the current engine state…</span>
          </div>
        </section>
      </main>
    </div>

    <aside class="ui-shell__inspector" aria-label="Story tools" data-ui-region="inspector" data-shell-inspector>
      <header class="ui-shell__inspector-header">
        <div>
          <p class="ui-shell__eyebrow">Context</p>
          <h2 class="ui-heading ui-heading--2" tabindex="-1" data-shell-inspector-heading>Story tools</h2>
        </div>
        <button class="ui-button ui-button--quiet ui-button--icon" type="button" aria-label="Close story tools" title="Close" data-shell-inspector-close>
          <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/assets/icons/sonder-icons.svg#icon-close"></use></svg>
        </button>
      </header>
      <div class="ui-shell__inspector-body" data-shell-inspector-body>
        <p class="ui-muted">Choose a story before opening its contextual tools.</p>
      </div>
      <div class="ui-shell__inspector-resize" aria-hidden="true"></div>
    </aside>

    <div class="ui-shell__overlay-host" data-ui-region="overlays" data-shell-overlay-host></div>
    <div class="ui-shell__notice-host" data-ui-region="notices" data-shell-notice-host aria-live="polite" aria-atomic="false"></div>
    <div class="ui-shell__task-host" data-ui-region="tasks" data-shell-task-host></div>
  </div>
  <script type="module" src="/static/js/ui-next/main.js?release=wp03.1"></script>
</body>
</html>
